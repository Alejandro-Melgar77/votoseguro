services:
  # Backend FastAPI Web Service
  - type: web
    name: votoseguro-api
    runtime: python
    rootDir: apps/api
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: RUN_EMBEDDED_SCHEDULER
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: NULLIFIER_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: "postgresql+asyncpg://postgres:proyectofinalvotoseguro@db.wmbyygrelcrcazxqedwr.supabase.co:5432/postgres"
      - key: SYNC_DATABASE_URL
        value: "postgresql+psycopg://postgres:proyectofinalvotoseguro@db.wmbyygrelcrcazxqedwr.supabase.co:5432/postgres"
      - key: CORS_ORIGINS
        value: "https://votoseguro.pages.dev,http://localhost:5173"
      - key: PLATFORM_ADMIN_EMAIL
        value: "admin@votoseguro.org"
      - key: PLATFORM_ADMIN_PASSWORD
        value: "AdminPlatform2026!"

services:
  # Backend FastAPI Web Service
  - type: web
    name: votoseguro-api
    runtime: python
    plan: free
    rootDir: apps/api
    autoDeploy: true
    buildCommand: "pip install -r requirements.lock.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DEMO_CREDENTIAL_INSPECTOR_ENABLED
        value: "false"
      - key: DATABASE_SSL_REQUIRED
        value: "true"
      - key: RUN_EMBEDDED_SCHEDULER
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: NULLIFIER_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SYNC_DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://votoseguro.pages.dev,http://localhost:5173"
      - key: PLATFORM_ADMIN_EMAIL
        value: "admin@votoseguro.org"
      - key: PLATFORM_ADMIN_PASSWORD
        generateValue: true
      - key: AI_LOCAL_ENABLED
        value: "true"
      - key: NGROK_STATIC_DOMAIN
        value: "repackage-remarry-reviving.ngrok-free.dev"
      - key: LLM_BASE_URL
        value: "https://repackage-remarry-reviving.ngrok-free.dev/v1"
      - key: LLM_MODEL_NAME
        value: "votoseguro-lfm3"
      - key: LLM_TIMEOUT_SECONDS
        value: "25.0"
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: AI_EXTERNAL_ENABLED
        value: "true"
      - key: GEMINI_TIMEOUT_SECONDS
        value: "20.0"

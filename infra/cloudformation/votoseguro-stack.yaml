AWSTemplateFormatVersion: '2010-09-09'
Description: 'VotoSeguro AWS Free Tier Stack - Branch JERS (Servidor Unico Optimizado t3.micro)'

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    Description: Tipo de instancia EC2 (t3.micro incluido en Nivel Gratuito de AWS)
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: AMI oficial de Amazon Linux 2023
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-02116bd2ab0c22385
    Description: VPC por defecto para despliegue
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-01206a3f3f381f3d3
    Description: Subred publica por defecto en us-east-1a
  GithubBranch:
    Type: String
    Default: JERS
    Description: Rama de GitHub desde la cual desplegar el codigo fuente
  GithubRepoUrl:
    Type: String
    Default: https://github.com/Alejandro-Melgar77/votoseguro.git
    Description: Repositorio publico de GitHub

Resources:
  # 1. Bucket S3 para almacenar los activos compilados del Frontend React
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'votoseguro-web-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # 2. IAM Role e Instance Profile para administracion SSM y lectura de S3
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-ec2-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: S3ReadWebAssets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub '${WebBucket.Arn}'
                  - !Sub '${WebBucket.Arn}/*'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${AWS::StackName}-ec2-instance-profile'
      Roles:
        - !Ref EC2Role

  # 3. Security Group para el servidor EC2
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-sg'
      GroupDescription: 'Acceso HTTP, HTTPS y SSH para VotoSeguro'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: 'Trafico HTTP web y API'
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: 'Trafico HTTPS web y API'
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: 'Acceso SSH administracion'
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: 'Salida completa a internet'

  # 4. Instancia EC2 con arranque automatico desde la rama JERS
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      SubnetId: !Ref SubnetId
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !GetAtt EC2SecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-server'
        - Key: Branch
          Value: !Ref GithubBranch
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1
          echo "=== INICIANDO DESPLIEGUE VOTOSEGURO (RAMA ${GithubBranch}) ==="

          # 1. Swap de 2 GB para estabilidad en t3.micro
          if [ ! -f /swapfile ]; then
              dd if=/dev/zero of=/swapfile bs=128M count=16
              chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
              echo '/swapfile swap swap defaults 0 0' >> /etc/fstab
          fi

          # 2. Paquetes y Docker Compose
          dnf install -y git docker nginx openssl awscli
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -sSL https://github.com/docker/compose/releases/download/v2.29.2/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          sed -i 's/listen       80 default_server;/listen       8088 default_server;/; s/listen       \[::\]:80 default_server;/listen       [::]:8088 default_server;/' /etc/nginx/nginx.conf || true
          systemctl enable --now nginx

          # 3. Código fuente desde la rama de GitHub
          mkdir -p /opt/votoseguro
          git clone -b ${GithubBranch} ${GithubRepoUrl} /opt/votoseguro/app

          # 4. Secretos generados en la instancia (nunca en el repositorio)
          if [ ! -f /opt/votoseguro/.env ]; then
              umask 077
              {
                echo "POSTGRES_USER=votoseguro"
                echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
                echo "POSTGRES_DB=votoseguro_db"
                echo "SECRET_KEY=$(openssl rand -hex 32)"
                echo "NULLIFIER_SECRET=$(openssl rand -hex 32)"
                echo "PLATFORM_ADMIN_EMAIL=admin@votoseguro.org"
                echo "PLATFORM_ADMIN_PASSWORD=AdminPlatform2026!"
                echo "AI_LOCAL_ENABLED=false"
                echo "AI_EXTERNAL_ENABLED=false"
              } > /opt/votoseguro/.env
          fi

          # 5. Esperar el frontend en S3 (lo sube scripts/deploy_aws_free_tier.py)
          for i in $(seq 1 60); do
              aws s3 ls s3://${WebBucket}/index.html --region ${AWS::Region} >/dev/null 2>&1 && break
              sleep 10
          done

          # 6. API, frontend y HTTPS (Let's Encrypt en <ip>.sslip.io)
          BRANCH=${GithubBranch} WEB_BUCKET=${WebBucket} AWS_REGION=${AWS::Region} bash /opt/votoseguro/app/infra/aws/server/update.sh
          echo "=== DESPLIEGUE FINALIZADO ==="

Outputs:
  WebUrl:
    Description: 'URL unica de VotoSeguro (HTTPS con Lets Encrypt)'
    Value: !Join ['', ['https://', !Join ['-', !Split ['.', !GetAtt EC2Instance.PublicIp]], '.sslip.io']]
  EC2PublicIp:
    Description: 'IP Publica del Servidor EC2'
    Value: !GetAtt EC2Instance.PublicIp
  EC2PublicDns:
    Description: 'DNS Publico del Servidor EC2'
    Value: !GetAtt EC2Instance.PublicDnsName
  WebBucketName:
    Description: 'Nombre del Bucket S3 del Frontend'
    Value: !Ref WebBucket

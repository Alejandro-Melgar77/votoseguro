AWSTemplateFormatVersion: '2010-09-09'
Description: 'VotoSeguro AWS Free Tier Stack - Branch JERS (Servidor Unico Optimizado t3.micro)'

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    Description: Tipo de instancia EC2 (t3.micro incluido en Nivel Gratuito de AWS)
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: AMI oficial de Amazon Linux 2023
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-02116bd2ab0c22385
    Description: VPC por defecto para despliegue
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-01206a3f3f381f3d3
    Description: Subred publica por defecto en us-east-1a
  GithubBranch:
    Type: String
    Default: JERS
    Description: Rama de GitHub desde la cual desplegar el codigo fuente
  GithubRepoUrl:
    Type: String
    Default: https://github.com/Alejandro-Melgar77/votoseguro.git
    Description: Repositorio publico de GitHub

Resources:
  # 1. Bucket S3 para almacenar los activos compilados del Frontend React
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'votoseguro-web-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # 2. IAM Role e Instance Profile para administracion SSM y lectura de S3
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-ec2-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: S3ReadWebAssets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub '${WebBucket.Arn}'
                  - !Sub '${WebBucket.Arn}/*'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${AWS::StackName}-ec2-instance-profile'
      Roles:
        - !Ref EC2Role

  # 3. Security Group para el servidor EC2
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-sg'
      GroupDescription: 'Acceso HTTP, HTTPS y SSH para VotoSeguro'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: 'Trafico HTTP web y API'
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: 'Trafico HTTPS web y API'
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: 'Acceso SSH administracion'
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: 'Salida completa a internet'

  # 4. Instancia EC2 con arranque automatico desde la rama JERS
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      SubnetId: !Ref SubnetId
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !GetAtt EC2SecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-server'
        - Key: Branch
          Value: !Ref GithubBranch
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1
          echo "=== INICIANDO DESPLIEGUE VOTOSEGURO (RAMA ${GithubBranch}) ==="

          # 1. Configurar 2GB de memoria Swap para estabilidad en t3.micro
          if [ ! -f /swapfile ]; then
              dd if=/dev/zero of=/swapfile bs=128M count=16
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile
              echo '/swapfile swap swap defaults 0 0' >> /etc/fstab
              echo "Memoria Swap de 2GB activada exitosamente."
          fi

          # 2. Instalar paquetes necesarios
          dnf update -y
          dnf install -y git docker nginx openssl awscli
          systemctl enable --now docker
          usermod -aG docker ec2-user

          # 3. Instalar Docker Compose CLI plugin
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -sSL https://github.com/docker/compose/releases/download/v2.29.2/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          ln -sf /usr/local/lib/docker/cli-plugins/docker-compose /usr/local/bin/docker-compose

          # 4. Generar certificado SSL autofirmado para HTTPS
          mkdir -p /etc/nginx/ssl
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
              -keyout /etc/nginx/ssl/votoseguro.key \
              -out /etc/nginx/ssl/votoseguro.crt \
              -subj "/C=BO/ST=SantaCruz/L=SantaCruz/O=UAGRM/OU=FICCT/CN=votoseguro"

          # 5. Descargar frontend web compilado desde S3
          mkdir -p /var/www/votoseguro/web
          for i in {1..40}; do
              if aws s3 sync s3://${WebBucket} /var/www/votoseguro/web --region ${AWS::Region} && [ -f /var/www/votoseguro/web/index.html ]; then
                  echo "Frontend web descargado exitosamente de S3."
                  break
              fi
              echo "Esperando activos de frontend en S3... (intento $i)"
              sleep 5
          done

          # 6. Clonar el repositorio desde la rama JERS
          mkdir -p /opt/votoseguro
          git clone -b ${GithubBranch} ${GithubRepoUrl} /opt/votoseguro/app
          cd /opt/votoseguro/app

          # Si por alguna razon S3 no tenia el frontend, usar el de la app o enlace simbolico
          if [ ! -f /var/www/votoseguro/web/index.html ] && [ -d /opt/votoseguro/app/apps/web/dist ]; then
              cp -r /opt/votoseguro/app/apps/web/dist/* /var/www/votoseguro/web/
          fi

          # 7. Configurar Nginx para servir el Frontend SPA y hacer Proxy a la API
          cat << 'EOF_NGINX' > /etc/nginx/conf.d/votoseguro.conf
          server {
              listen 80 default_server;
              listen 443 ssl default_server;
              server_name _;

              ssl_certificate /etc/nginx/ssl/votoseguro.crt;
              ssl_certificate_key /etc/nginx/ssl/votoseguro.key;
              ssl_protocols TLSv1.2 TLSv1.3;

              client_max_body_size 25M;

              # Frontend Web React SPA
              root /var/www/votoseguro/web;
              index index.html;

              location / {
                  try_files $uri $uri/ /index.html;
              }

              # Backend FastAPI Proxy
              location /api/ {
                  proxy_pass http://127.0.0.1:8000/api/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 300s;
                  proxy_connect_timeout 75s;
              }

              location /docs {
                  proxy_pass http://127.0.0.1:8000/docs;
                  proxy_set_header Host $host;
              }

              location /openapi.json {
                  proxy_pass http://127.0.0.1:8000/openapi.json;
                  proxy_set_header Host $host;
              }

              location /health {
                  proxy_pass http://127.0.0.1:8000/api/v1/health;
                  proxy_set_header Host $host;
              }
          }
          EOF_NGINX

          sed -i 's/listen       80 default_server;/listen       8088 default_server;/' /etc/nginx/nginx.conf || true
          systemctl enable --now nginx
          systemctl restart nginx

          # 8. Generar archivo docker-compose.prod.yml
          cat << 'EOF_COMPOSE' > /opt/votoseguro/app/docker-compose.prod.yml
          version: '3.8'

          services:
            postgres:
              image: postgres:16-alpine
              container_name: votoseguro-postgres
              restart: always
              environment:
                POSTGRES_USER: votoseguro
                POSTGRES_PASSWORD: votoseguro_prod_db_pwd_2026!
                POSTGRES_DB: votoseguro_db
              ports:
                - "127.0.0.1:5432:5432"
              volumes:
                - pgdata:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U votoseguro -d votoseguro_db"]
                interval: 5s
                timeout: 5s
                retries: 5

            api:
              build:
                context: ./apps/api
                dockerfile: Dockerfile
              container_name: votoseguro-api
              restart: always
              depends_on:
                postgres:
                  condition: service_healthy
              environment:
                DATABASE_URL: postgresql+asyncpg://votoseguro:votoseguro_prod_db_pwd_2026!@postgres:5432/votoseguro_db
                SYNC_DATABASE_URL: postgresql+psycopg://votoseguro:votoseguro_prod_db_pwd_2026!@postgres:5432/votoseguro_db
                ENVIRONMENT: staging
                DEBUG: "true"
                SECRET_KEY: prod_jwt_secret_key_minimum_32_characters_long_jers_2026!
                NULLIFIER_SECRET: prod_nullifier_secret_key_minimum_32_chars_jers_2026!
                RUN_EMBEDDED_SCHEDULER: "true"
                PLATFORM_ADMIN_EMAIL: admin@votoseguro.org
                PLATFORM_ADMIN_PASSWORD: AdminPlatform2026!
                CORS_ORIGINS: "*"
                AI_LOCAL_ENABLED: "false"
                AI_EXTERNAL_ENABLED: "false"
              ports:
                - "127.0.0.1:8000:8000"
              command: >
                sh -c "alembic upgrade head &&
                       python -m app.db.seed_demo &&
                       uvicorn app.main:app --host 0.0.0.0 --port 8000"

          volumes:
            pgdata:
          EOF_COMPOSE

          # 9. Iniciar los contenedores Docker
          cd /opt/votoseguro/app
          docker compose -f docker-compose.prod.yml up -d --build

          # 10. Script para actualizar ante nuevos cambios en JERS
          cat << 'EOF_UPDATE' > /opt/votoseguro/update.sh
          #!/bin/bash
          set -e
          cd /opt/votoseguro/app
          git fetch origin JERS
          git reset --hard origin/JERS
          aws s3 sync s3://${WebBucket} /var/www/votoseguro/web --region ${AWS::Region} || true
          docker compose -f docker-compose.prod.yml up -d --build
          echo "VotoSeguro actualizado a la ultima version de JERS"
          EOF_UPDATE
          chmod +x /opt/votoseguro/update.sh

          echo "VOTOSEGURO_DESPLIEGUE_COMPLETADO $(date)" > /opt/votoseguro/status.txt
          echo "=== DESPLIEGUE FINALIZADO EXITOSAMENTE ==="

Outputs:
  WebUrlHttp:
    Description: 'URL Web y API de VotoSeguro (HTTP)'
    Value: !Sub 'http://${EC2Instance.PublicDnsName}'
  WebUrlIp:
    Description: 'URL Directa por IP'
    Value: !Sub 'http://${EC2Instance.PublicIp}'
  WebUrlHttps:
    Description: 'URL Web y API de VotoSeguro (HTTPS SSL Autofirmado)'
    Value: !Sub 'https://${EC2Instance.PublicDnsName}'
  EC2PublicIp:
    Description: 'IP Publica del Servidor Backend EC2'
    Value: !GetAtt EC2Instance.PublicIp
  EC2PublicDns:
    Description: 'DNS Publico del Servidor Backend EC2'
    Value: !GetAtt EC2Instance.PublicDnsName
  WebBucketName:
    Description: 'Nombre del Bucket S3 del Frontend'
    Value: !Ref WebBucket

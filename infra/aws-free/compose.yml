services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: /opt/votoseguro/private/runtime.env
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/certs/server.crt", "-c", "ssl_key_file=/certs/server.key"]
    volumes:
      - /opt/votoseguro/data/postgres:/var/lib/postgresql/data
      - /opt/votoseguro/private/certs/server.crt:/certs/server.crt:ro
      - /opt/votoseguro/private/certs/server.key:/certs/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votoseguro -d votoseguro"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  api:
    image: votoseguro-api:${RELEASE_TAG:-latest}
    restart: unless-stopped
    env_file: /opt/votoseguro/private/runtime.env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    volumes:
      - /opt/votoseguro/private/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging
  scheduler:
    image: votoseguro-api:${RELEASE_TAG:-latest}
    restart: unless-stopped
    env_file: /opt/votoseguro/private/runtime.env
    command: ["python", "-m", "app.modules.scheduler.worker"]
    volumes:
      - /opt/votoseguro/private/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - /opt/votoseguro/web:/srv:ro
      - /opt/votoseguro/private/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/votoseguro/data/caddy:/data
    depends_on: [api]
    logging: *logging

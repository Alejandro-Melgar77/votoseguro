name: Verify application and AWS infrastructure
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: votoseguro
          POSTGRES_PASSWORD: ci-database-password
          POSTGRES_DB: votoseguro
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U votoseguro"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://votoseguro:ci-database-password@localhost:5432/votoseguro
      LLM_BASE_URL: http://127.0.0.1:59999/v1
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - run: alembic upgrade head
      - run: python -m pytest -q
      - run: docker build -t votoseguro-api:verify .
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @votoseguro/web build
      - run: pnpm --filter @votoseguro/mobile check-types
      - run: pnpm --filter @votoseguro/web exec playwright install --with-deps chromium
      - run: pnpm --filter @votoseguro/web test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/web/test-results
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
      - run: terraform -chdir=infra/aws fmt -check
      - run: terraform -chdir=infra/aws init -backend=false
      - run: terraform -chdir=infra/aws validate
  deploy:
    if: github.ref == 'refs/heads/JERS' && vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: [api, frontend, infrastructure]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Pull the tested JERS commit and deploy on AWS
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          PARAMETERS=$(python -c 'import json,os; sha=os.environ["RELEASE_SHA"]; print(json.dumps({"commands":["set -eu", "curl -fsSL https://raw.githubusercontent.com/Alejandro-Melgar77/votoseguro/" + sha + "/infra/aws-free/deploy.sh -o /tmp/votoseguro-deploy.sh", "bash /tmp/votoseguro-deploy.sh " + sha],"executionTimeout":["1800"]}))')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$PARAMETERS" --timeout-seconds 1800 --query Command.CommandId --output text)
          for attempt in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            if [ "$STATUS" = Success ]; then exit 0; fi
            if [[ "$STATUS" =~ ^(Failed|Cancelled|TimedOut)$ ]]; then echo "AWS deployment $STATUS ($COMMAND_ID)"; exit 1; fi
            sleep 10
          done
          echo "AWS deployment exceeded the wait limit ($COMMAND_ID)"; exit 1

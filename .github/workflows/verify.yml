name: Verify application and AWS infrastructure
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: votoseguro
          POSTGRES_PASSWORD: ci-database-password
          POSTGRES_DB: votoseguro
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U votoseguro"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://votoseguro:ci-database-password@localhost:5432/votoseguro
      AI_LOCAL_ENABLED: 'false'
      AI_EXTERNAL_ENABLED: 'false'
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - run: alembic upgrade head
      - run: pytest -q
      - run: docker build -t votoseguro-api:verify .
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @votoseguro/web build
      - run: pnpm --filter @votoseguro/mobile check-types
      - run: pnpm --filter @votoseguro/web exec playwright install --with-deps chromium
      - run: pnpm --filter @votoseguro/web test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/web/test-results
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
      - run: terraform -chdir=infra/aws fmt -check
      - run: terraform -chdir=infra/aws init -backend=false
      - run: terraform -chdir=infra/aws validate
